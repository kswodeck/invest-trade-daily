name: Report Watchdog

# The daily report depends on GitHub delivering a cron inside a five-hour ET
# window. That is not a promise GitHub makes: on 2026-08-27 both arms arrived
# about ten hours late, the gate correctly refused to publish an afternoon
# "pre-open" report, and the day produced nothing — silently.
#
# This workflow is the recovery path and the alarm. It asks whether the branch
# holds a usable report for today's ET date. If not, and there is still time, it
# dispatches the daily report. If the window has closed with nothing published,
# it fails loudly so the silence is visible.
#
# Its own crons ride the same best-effort scheduler, so several slots are
# declared — and the same catch-up runs from Refresh Prices too, on the theory
# that whichever workflow GitHub does manage to deliver can rescue the day.
# They are cheap: the common case is a few seconds of looking and going quiet.

on:
  schedule:
    - cron: "25 12 * * *"   # 08:25 EDT / 07:25 EST — first catch-up
    - cron: "25 13 * * *"   # 09:25 EDT / 08:25 EST
    - cron: "25 14 * * *"   # 10:25 EDT / 09:25 EST — last catch-up
    - cron: "25 16 * * *"   # 12:25 EDT / 11:25 EST — past the window: alarm
  workflow_dispatch:

concurrency:
  group: report-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - id: catchup
        uses: ./.github/actions/report-catch-up
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

      - name: Alarm — the window closed with nothing usable
        if: steps.catchup.outputs.late == 'true'
        env:
          STATE: ${{ steps.catchup.outputs.state }}
        run: |
          ET_DATE=$(TZ=America/New_York date +%F)
          if [ "$STATE" = "stub" ]; then
            WHAT="a stub was published for $ET_DATE, with no recommendations and no watchlist"
          else
            WHAT="no report was published for $ET_DATE at all"
          fi
          echo "::error::The report window has closed and $WHAT."
          {
            echo "**Nothing usable for $ET_DATE.**"
            echo
            echo "The window has closed and $WHAT."
            echo
            echo "Either the scheduled run never arrived inside the window, or the"
            echo "pipeline ran and produced nothing. Check the most recent"
            echo '`Daily Trade Report` run before dispatching another — a report'
            echo "started now is researched now, not pre-open, and should say so."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
