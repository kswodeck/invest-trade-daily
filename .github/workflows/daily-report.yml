name: Daily Trade Report

on:
  # An external caller is the only way to actually get 6am. GitHub's scheduler
  # has delivered this repo's crons 4-11 hours late every day since 2026-08-27,
  # and no cron declared here can fix that — see docs/scheduling.md.
  repository_dispatch:
    types: [run-daily-report]

  schedule:
    # 06:00 America/New_York year-round. GitHub cron is UTC only and has no DST
    # awareness, so both arms are declared and the gate job below decides which
    # one does the work. Both arms fire every day, so a second run appearing in
    # the Actions list and finishing in ten seconds is the gate working, not a
    # double report — see scripts/schedule_gate.py.
    #
    # Deliberately off the top of the hour: :00 is the busiest minute on
    # GitHub's scheduler and the one it sheds hardest under load. This is a
    # hedge, not a fix.
    - cron: "7 10 * * *"   # 06:07 EDT / 05:07 EST
    - cron: "7 11 * * *"   # 07:07 EDT / 06:07 EST
  workflow_dispatch:
    inputs:
      research_minutes:
        description: "Hard cap on the research phase, in minutes"
        required: false
        default: "60"
      dry_run:
        description: "Produce the report but do not write to Google Sheets"
        type: boolean
        required: false
        default: false
      respect_window:
        description: >
          "true" applies the 6-11 ET window and the duplicate check, as a
          scheduled run would. Automated callers set this; leave it alone when
          dispatching by hand. Declared as a string, not a boolean, because the
          primary caller is the REST API and a string is unambiguous there.
        type: string
        required: false
        default: "false"

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  # Decides whether this invocation is today's run. Kept separate so the skip
  # costs a few seconds rather than spinning up the whole pipeline.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      date: ${{ steps.check.outputs.date }}
      started_et: ${{ steps.check.outputs.started_et }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # A scheduled run is pinned to the SHA that existed when GitHub created
      # it, so this checkout cannot contain a report the earlier arm pushed
      # minutes ago. Ask the branch tip instead — reading the working tree here
      # is what made the duplicate guard a race rather than a check.
      #
      # And ask what the report *is*, not merely whether the file exists: a
      # synthesis killed mid-write leaves a schema-valid skeleton that must not
      # count as today's work. See scripts/report_state.py.
      - id: published
        name: What does the branch hold for today?
        run: |
          set -euo pipefail
          ET_DATE=$(TZ=America/New_York date +%F)
          git fetch --depth=1 origin "${{ github.ref_name }}"
          if REPORT=$(git cat-file -p "FETCH_HEAD:reports/$ET_DATE/report.json" 2>/dev/null); then
            STATE=$(printf '%s' "$REPORT" | python3 scripts/report_state.py)
          else
            STATE=missing
          fi
          echo "reports/$ET_DATE/report.json on ${{ github.ref_name }}: $STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      # REPORT_WINDOW_ET is half-open. It is wide because GitHub's scheduler is
      # best-effort and has delivered this repo's crons up to ten hours late;
      # it is bounded because a report framed as the 6am pre-open view is a lie
      # if it is researched in the afternoon.
      - id: check
        name: Should today's report run?
        env:
          REPORT_WINDOW_ET: "6-11"
        run: |
          set -euo pipefail
          printf '### Schedule gate\n```\n' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/schedule_gate.py \
            --event-name "${{ github.event_name }}" \
            --cron "${{ github.event.schedule }}" \
            --report-state "${{ steps.published.outputs.state }}" \
            --window "${REPORT_WINDOW_ET}" \
            --respect-window "${{ github.event.inputs.respect_window || 'false' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # 60 research + 15 synthesis + two action cold starts + publish ran ~96 min
    # on the first live schedule. 150 leaves room without risking a kill that
    # would skip the Sheet write and the commit.
    timeout-minutes: 150
    permissions:
      contents: write
      id-token: write
    env:
      REPORT_DATE: ${{ needs.gate.outputs.date }}
      RUN_STARTED_ET: ${{ needs.gate.outputs.started_et }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight — data sources
        continue-on-error: true
        run: |
          echo "Checking which sources are reachable and keyed..."
          python scripts/market_data.py quote SPY || true
          python scripts/market_data.py crypto bitcoin || true

      # Gives the research phase memory: open positions it must manage rather
      # than re-pitch, its own hit rate by category, and which symbols it has
      # been repeating.
      - name: Build prior context
        continue-on-error: true
        run: python scripts/build_context.py "$REPORT_DATE" --days 10

      # Phase 1. The timeout is enforced by GitHub, not by asking the model to
      # watch a clock. continue-on-error lets the job carry on to synthesis when
      # the cap kills this step, which is the normal, expected outcome.
      - name: Phase 1 — research
        id: research
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(github.event.inputs.research_minutes || '60') }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/daily-research"
          claude_args: |
            --model claude-opus-5
            --allowedTools "WebSearch,WebFetch,Bash,Read,Write,Edit,Glob,Grep"

      - name: Checkpoint — what survived research
        if: always()
        run: |
          echo "Research step outcome: ${{ steps.research.outcome }}"
          NOTES="reports/$REPORT_DATE/notes.md"
          CANDIDATES="reports/$REPORT_DATE/candidates.jsonl"
          [ -f "$NOTES" ] && wc -c "$NOTES" || echo "::warning::No research notes were produced."
          if [ -f "$CANDIDATES" ]; then
            N=$(grep -c . "$CANDIDATES" || echo 0)
            echo "Candidates captured: $N"
            python -c "
          import json,sys
          for line in open('$CANDIDATES'):
              if line.strip():
                  c = json.loads(line)
                  print(f\"  {c['symbol']:<10} {c['direction']:<10} conv {c['conviction']}  {c['catalyst']['event'][:50]}\")
          " || true
          else
            echo "::warning::No candidates were captured — synthesis will have to reconstruct from notes."
          fi

      - name: Phase 2 — synthesis
        id: synthesis
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/daily-synthesis"
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Guarantee a publishable report
        if: always()
        run: |
          if [ "${{ steps.research.outcome }}" = "failure" ]; then
            python scripts/ensure_report.py "$REPORT_DATE" --research-truncated
          else
            python scripts/ensure_report.py "$REPORT_DATE"
          fi

      # The 6-11 ET window means a delivery hours late still produces a report.
      # It must not then read like the 6am pre-open view — say when it actually
      # ran, before anything downstream renders it.
      - name: Note the hour if this was not the 6am run
        if: always()
        continue-on-error: true
        run: |
          python scripts/note_late_run.py "reports/$REPORT_DATE/report.json" \
            --started-et "$RUN_STARTED_ET" | tee -a "$GITHUB_STEP_SUMMARY"

      # Deterministic checks on every number the model wrote: recomputed
      # reward-to-risk, direction consistency, entry against the live price,
      # catalyst dates against the real earnings calendar, target reachability
      # in ATR, and whether the cited URLs resolve. Annotates only here so the
      # red team can see the flags before anything is cut.
      - name: Phase 2b — validate the numbers
        id: validate
        if: always()
        continue-on-error: true
        run: |
          python scripts/validate_report.py "reports/$REPORT_DATE/report.json"
          COUNT=$(python -c "import json;print(len(json.load(open('reports/$REPORT_DATE/report.json'))['recommendations']))" 2>/dev/null || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # A separate pass that only attacks. Generating and critiquing in one
      # phase means falsification is the first thing squeezed by the clock, and
      # an author is a poor judge of their own idea.
      - name: Phase 2c — red team
        id: redteam
        if: always() && steps.validate.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/daily-redteam"
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      # The red team edits report.json by hand, so re-guarantee it parses before
      # anything downstream depends on it.
      - name: Re-guarantee the report after red team
        if: always()
        run: python scripts/ensure_report.py "$REPORT_DATE"

      # Now enforce: anything still failing a hard check moves to the watchlist
      # with its reason attached, rather than being published as a live idea.
      - name: Phase 2d — enforce validation
        if: always()
        continue-on-error: true
        run: python scripts/validate_report.py "reports/$REPORT_DATE/report.json" --enforce

      - name: Phase 3 — publish to Google Sheets
        if: always()
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/publish_sheets.py "reports/$REPORT_DATE/report.json" --dry-run
          else
            python scripts/publish_sheets.py "reports/$REPORT_DATE/report.json"
          fi

      - name: Phase 4 — commit the audit trail
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "invest-trade-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ state/ || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          IDEAS=$(python -c "import json;print(len(json.load(open('reports/$REPORT_DATE/report.json'))['recommendations']))" 2>/dev/null || echo "?")
          git commit -m "report: $REPORT_DATE ($IDEAS ideas)"

          # Re-authenticate before pushing. actions/checkout leaves a credential
          # behind, but the Claude action runs in between and reconfigures git
          # auth, so by this step the stored credential no longer works. Drop the
          # stale auth header and point the remote at a fresh token. The token is
          # masked in logs by Actions.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing and retrying..."
            sleep $((2 ** attempt))
            git pull --rebase origin ${{ github.ref_name }} || true
          done
          echo "::error::Could not push the report after 4 attempts."
          exit 1

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ needs.gate.outputs.date }}
          path: reports/${{ needs.gate.outputs.date }}/
          retention-days: 30

      - name: Summary
        if: always()
        env:
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
          SYNTHESIS_OUTCOME: ${{ steps.synthesis.outcome }}
          REDTEAM_OUTCOME: ${{ steps.redteam.outcome }}
        run: python scripts/step_summary.py "$REPORT_DATE" >> "$GITHUB_STEP_SUMMARY"

      # Deliberately last, and deliberately red. GitHub only emails the owner
      # when a scheduled run fails, so a stub report has to fail the job or the
      # one morning that produced nothing would be the one morning that looked
      # fine. The Sheet and the commit have already happened by this point.
      - name: Fail the run if the report is a stub
        if: always()
        run: |
          python - "$REPORT_DATE" <<'PY'
          import json, sys, pathlib
          path = pathlib.Path("reports") / sys.argv[1] / "report.json"
          report = json.loads(path.read_text())
          if report.get("pipeline_failure"):
              print("::error title=Report pipeline failed::"
                    "Synthesis produced nothing usable; a stub was published. "
                    "See the Data quality note in the run summary.")
              sys.exit(1)
          print(f"Report OK: {len(report['recommendations'])} recommendations.")
          PY
