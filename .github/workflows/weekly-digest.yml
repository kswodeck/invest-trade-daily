name: Weekly Digest

# Sunday scorecard: what closed, hit rate by conviction / horizon / asset class,
# and whether the conviction score is actually calibrated. Reads the same
# state/open_positions.json the daily run maintains, so it needs no research
# and finishes in under a minute.

on:
  schedule:
    - cron: "0 12 * * 0"   # Sundays, 08:00 EDT / 07:00 EST
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Week-ending date (YYYY-MM-DD). Blank means today."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the digest
        id: digest
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          WEEK="${{ github.event.inputs.week_ending }}"
          if [ -z "$WEEK" ]; then WEEK=$(TZ=America/New_York date +%F); fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          python scripts/weekly_digest.py "$WEEK"

      - name: Add the digest to the run summary
        if: always()
        run: |
          WEEK="${{ steps.digest.outputs.week }}"
          if [ -f "reports/weekly/$WEEK.md" ]; then
            cat "reports/weekly/$WEEK.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the digest
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "invest-trade-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/weekly/ || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "digest: week ending ${{ steps.digest.outputs.week }}"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((2 ** attempt))
            git pull --rebase origin ${{ github.ref_name }} || true
          done
          echo "::error::Could not push the weekly digest."
          exit 1
