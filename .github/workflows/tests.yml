name: Tests

# The scheduling bugs this suite covers were invisible for two weeks: both DST
# arms passed an hour check meant to reject one of them, and the duplicate guard
# was a race that happened to win. None of it showed up until a morning went
# missing. Cheap to run, so run it on every change to the logic.

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      # config/odd_lot.json is read by the screener's tests, so a threshold
      # edited there can fail them without a line of Python changing.
      - "config/odd_lot.json"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/odd_lot.json"
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately no `pip install -r requirements.txt`. The suite is
      # stdlib-only and runs in under a second, and the bare runner is what
      # caught an `import market_data` sitting above its own try/except in
      # `_current_price` — in production that would have taken down grading
      # for every position the first time the import failed for any reason.
      # tests/test_no_hard_dependencies.py keeps the property true.
      - name: Run the unit tests
        run: python -m unittest discover -s tests -v
